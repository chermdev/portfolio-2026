packages:
  - apps/*
  - packages/*
minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy release required by Astro's language server; registry signature metadata inspected.
  - chokidar@4.0.3
strictDepBuilds: true
overrides:
  reselect: 5.3.0
  # @astrojs/vercel's native deps accept 1.x or a 2.0 beta; the beta breaks @astrojs/check's language server.
  '@emnapi/core': 1.11.3
  '@emnapi/runtime': 1.11.3
onlyBuiltDependencies:
  - esbuild
  - sharp
  # Via onnxruntime-web; its postinstall only prints version-scheme warnings.
  - protobufjs
